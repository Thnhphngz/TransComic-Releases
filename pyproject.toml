[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcomic"
dynamic = ["version"]
description = "Windows TXT and DOCX translation editor for Kira AI and official Gemini API"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "httpx>=0.27", "charset-normalizer>=3.3", "python-docx>=1.1", "lxml>=5", "cryptography>=43"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
transcomic = "transcomic.app:main"

[tool.setuptools.packages.find]
include = ["transcomic*"]

[tool.setuptools.dynamic]
version = {attr = "transcomic.version.VERSION"}

[tool.setuptools.package-data]
"transcomic.ui" = ["assets/*.svg"]

[tool.pytest.ini_options]
cache_dir = "${TRANSCOMIC_PYTEST_CACHE}"

