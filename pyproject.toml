[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcomic"
dynamic = ["version"]
description = "Windows TXT and DOCX translation editor for Kira AI and official Gemini API"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "httpx>=0.27", "charset-normalizer>=3.3", "python-docx>=1.1", "lxml>=5", "cryptography>=43", "mutagen>=1.47,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pillow==12.3.0"]
tts = ["kokoro-onnx==0.6.1", "onnxruntime==1.24.4", "numpy==2.5.1", "soundfile==0.14.0", "lameenc==1.9.0", "psutil==7.2.2", "phonemizer==3.4.0", "espeakng-loader==0.2.4", "misaki[zh]==0.7.4", "jaconv==0.5.0", "fugashi==1.5.2", "unidic-lite==1.0.8"]

[project.scripts]
transcomic = "transcomic.app:main"

[tool.setuptools.packages.find]
include = ["transcomic*"]

[tool.setuptools.dynamic]
version = {attr = "transcomic.version.VERSION"}

[tool.setuptools.package-data]
"transcomic.ui" = ["assets/*.svg"]
"transcomic.tts" = ["calibration.json", "gpu-pack.json", "setup-catalog.json"]
"transcomic.capcut" = ["mau-structure.zip", "mau-origin.json", "mau-animations.zip"]

[tool.pytest.ini_options]
cache_dir = "${TRANSCOMIC_PYTEST_CACHE}"
testpaths = ["tests"]

